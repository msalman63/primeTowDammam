<div
  class="fixed bottom-6 inset-e-6 z-50 flex flex-col items-end gap-3"
  [class]="isVisible() ? 'float-visible' : 'float-hidden'"
>
  <div class="flex flex-col items-end gap-1.5 group">
    <span
      class="opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 transition-all duration-200 text-xs font-bold px-3 py-1 rounded-md bg-(--zinc-800) text-(--white) border border-(--zinc-700) [font-family:var(--font-ar)] whitespace-nowrap pointer-events-none"
    >
      {{ languageService.isArabic() ? 'واتساب' : 'WhatsApp' }}
    </span>
    <a
      [href]="social.whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="WhatsApp"
      class="w-14 h-14 flex items-center justify-center text-2xl rounded-2xl shadow-[0_4px_20px_rgba(37,211,102,0.3)] hover:scale-110 hover:shadow-[0_6px_28px_rgba(37,211,102,0.5)] active:scale-95 transition-all duration-200 bg-[#25D366] text-white"
    >
      <img src="images/icons/whatsapp-icon.svg" alt="WhatsApp" class="w-8 h-8" />
    </a>
  </div>

  <div class="flex flex-col items-end gap-1.5 group">
    <span
      class="opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 transition-all duration-200 text-xs font-bold px-3 py-1 rounded-md bg-(--zinc-800) text-(--white) border border-(--zinc-700) [font-family:var(--font-ar)] whitespace-nowrap pointer-events-none"
    >
      {{ languageService.isArabic() ? 'اتصل الآن' : 'Call Now' }}
    </span>
    <a
      [href]="social.callUrl"
      aria-label="Call Now"
      class="float-pulse w-14 h-14 flex items-center justify-center text-2xl rounded-2xl bg-(--primary) text-(--white) shadow-[0_4px_20px_var(--primary-glow)] hover:bg-(--primary-light) hover:scale-110 active:scale-95 transition-all duration-200"
    >
      📞
    </a>
  </div>
</div>
