<div class="top-line h-px w-full"></div>

<div
  class="text-xs sm:text-sm font-bold py-2 text-center tracking-wide bg-(--primary-dark) text-(--white) [font-family:var(--font-ar)]">
  {{ languageService.tKey('emergencyStrip') }}
</div>

<nav [ngStyle]="{
    background: isScrolled() ? 'rgba(24,24,27,0.97)' : 'rgba(24,24,27,0.7)',
    'backdrop-filter': 'blur(14px)',
    'box-shadow': isScrolled() ? '0 8px 32px rgba(0,0,0,0.45)' : '',
    'border-bottom': '1px solid rgba(124,58,237,0.15)'
  }" class="sticky top-0 z-50 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
    <button (click)="navigateTo('home')" class="flex items-center gap-2.5 shrink-0 group">
      <span
        class="w-9 h-9 rounded-lg bg-(--primary) rotate-45 flex items-center justify-center shrink-0 group-hover:rotate-[135deg] transition-transform duration-500">
        <span
          class="-rotate-45 group-hover:rotate-[-135deg] text-sm font-black text-(--white) transition-transform duration-500">
          {{ brand.nameArShort.charAt(0) }}
        </span>
      </span>
      <span class="flex flex-col leading-tight">
        <span class="font-black [font-family:var(--font-ar)] text-(--white) text-lg sm:text-xl">
          {{ brand.nameArShort }}
        </span>
        <span
          class="[font-family:var(--font-en)] text-(--primary-light) text-[10px] font-bold tracking-[0.25em] uppercase">
          {{ brand.tagEn }}
        </span>
      </span>
    </button>

    <ul class="hidden lg:flex items-center gap-1">
      @for (link of navLinks; track link.id) {
      <li>
        <button (click)="navigateTo(link.fragment)"
          class="relative px-4 py-2 text-sm text-(--zinc-400) [font-family:var(--font-ar)] font-bold rounded-lg transition-all duration-200 hover:text-(--white) group cursor-pointer">
          {{ languageService.tr(link.label) }}
          <span
            class="absolute left-4 right-4 -bottom-1 h-[2px] bg-(--primary) scale-x-0 group-hover:scale-x-100 transition-transform duration-200 origin-center"></span>
        </button>
      </li>
      }
    </ul>

    <div class="flex items-center gap-2 shrink-0">
      <button (click)="languageService.toggle()"
        class="flex items-center px-3 py-1.5 rounded-lg text-xs font-bold border border-(--zinc-700) text-(--zinc-300) [font-family:var(--font-en)] hover:border-(--primary) hover:text-(--primary-light) transition-all duration-200 cursor-pointer">
        {{ languageService.isArabic() ? 'EN' : 'عر' }}
      </button>

      <a [href]="social.callUrl"
        class="hidden bg-(--primary) sm:flex items-center gap-2 px-4 py-2 [font-family:var(--font-ar)] font-bold text-sm shadow-[0_4px_16px_var(--primary-glow)] rounded-lg hover:bg-(--primary-light) transition-all duration-200 cursor-pointer text-(--white)">
        <span>📞</span>
        <span>{{ languageService.tKey('navCall') }}</span>
      </a>

      <button (click)="onToggleMenu()" aria-label="Toggle menu"
        class="lg:hidden p-2 transition-colors duration-200 rounded-lg hover:bg-(--zinc-800) cursor-pointer">
        <div class="menuIcon">
          @if (!isMenuOpen()) {
          <img class="w-8 h-8" src="images/icons/blue-burger.png" alt="menu" />
          }
          @if (isMenuOpen()) {
          <img class="w-5 h-5" src="images/icons/blue-close.png" alt="cross" />
          }
        </div>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
  <div class="lg:hidden px-4 pt-3 pb-5 flex flex-col gap-1 bg-(--zinc-900) border-t border-(--zinc-800)">
    @for (link of navLinks; track link.id) {
    <button (click)="navigateTo(link.fragment)"
      class="accent-edge [font-family:var(--font-ar)] text-(--zinc-300) text-start w-full px-4 py-3 text-sm font-bold rounded-md hover:text-(--white) hover:bg-(--zinc-800) transition-colors duration-200 cursor-pointer">
      {{ languageService.tr(link.label) }}
    </button>
    }
    <div class="my-2 border-t border-(--zinc-800)"></div>
    <div class="flex gap-2">
      <button (click)="languageService.toggle()"
        class="flex-1 py-2.5 text-sm text-(--zinc-300) border border-(--zinc-700) font-bold rounded-lg hover:border-(--primary) hover:text-(--primary-light) transition-all duration-200 cursor-pointer">
        {{ languageService.isArabic() ? 'English' : 'العربية' }}
      </button>
      <a [href]="social.callUrl"
        class="bg-(--primary) text-(--white) flex-1 py-2.5 text-center font-bold text-sm rounded-lg hover:bg-(--primary-light) transition-all duration-200 cursor-pointer">
        {{ languageService.tKey('navCall') }}
      </a>
    </div>
  </div>
  }
</nav>
